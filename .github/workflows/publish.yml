name: Publish

# npm trusted publishing (OIDC): no NPM_TOKEN secret. The npm-side trust
# relationship is keyed on this file name (publish.yml) + environment "npm".
#
# `publish` runs only in a run started on the tag it publishes, so the GITHUB_SHA and GITHUB_REF
# that npm provenance records name the commit that is built and published.
# - release: a GitHub release, other than a pre-release, publishes its tag.
# - workflow_dispatch on a v* tag publishes that tag: `refresh` starts these runs, and
#   `gh workflow run publish.yml --ref vX.Y.Z` retries a failed publish by hand.
# - schedule, or workflow_dispatch on main: when a bundled component has a newer release,
#   `refresh` bumps the deps and patch version, verifies, pushes the commit and tag to main, and
#   dispatches this workflow on the tag. A push made with GITHUB_TOKEN starts no workflow run;
#   a workflow_dispatch made with it does.
on:
  release:
    types: [published]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  refresh:
    # Default branch only: a dispatch on a tag is a publish, and other branches are not released.
    if: github.event_name != 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Can push to main and dispatch the publish run, but holds no id-token, so it cannot publish.
    permissions:
      contents: write
      actions: write
    steps:
      # Third-party install scripts and tests run in this job; only the push step gets the token.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Same npm pin as ci.yml, which says why.
      - run: npm install -g 'npm@^11.5.1'
      - name: Look for newer bundled component releases
        id: check
        run: node scripts/refresh-deps.mjs >> "$GITHUB_OUTPUT"
      - name: Nothing to publish
        if: steps.check.outputs.specs == ''
        run: echo "Bundled components are current; nothing to publish."
      - name: Bump components, lockfile, patch version and changelog
        if: steps.check.outputs.specs != ''
        env:
          SPECS: ${{ steps.check.outputs.specs }}
        run: |
          # shellcheck disable=SC2086 # SPECS is a space-separated list; split it into arguments.
          npm install --save $SPECS
          npm update
          npm version patch --no-git-tag-version
          node scripts/changelog-entry.mjs "Bundle ${SPECS// /, }."
          git diff --stat
      # `npm view` exits non-zero on a network error as well as on a 404, so read the full
      # version list: an unreachable registry then fails this step instead of passing it.
      # The check exits 3 for "published" and 0 for "not yet"; any other exit, such as node
      # throwing on output that isn't a version list, fails the step as well.
      - name: New version is not on npm yet
        if: steps.check.outputs.specs != ''
        run: |
          version=$(node -p 'require("./package.json").version')
          published=$(npm view pi-total-recall versions --json)
          rc=0
          node -e '
            const list = [].concat(JSON.parse(process.argv[1]));
            if (!list.length || !list.every((v) => typeof v === "string")) throw new Error("not a version list");
            process.exit(list.includes(process.argv[2]) ? 3 : 0);
          ' "$published" "$version" || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::pi-total-recall@$version is already on npm, so main is behind npm. Set package.json past the latest npm version by hand."
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::Could not read the published versions of pi-total-recall (check exited $rc)."
            exit 1
          fi
      - name: Lockfile resolves only from registry.npmjs.org
        if: steps.check.outputs.specs != ''
        run: "! grep -E '\"resolved\": \"' package-lock.json | grep -v 'https://registry.npmjs.org/'"
      - if: steps.check.outputs.specs != ''
        run: npm ci
      - if: steps.check.outputs.specs != ''
        run: npm test
      - name: Tarball ships every pi manifest path and no pi peers
        if: steps.check.outputs.specs != ''
        run: npm run check:pack
      - name: Commit, tag, push and dispatch the publish run
        if: steps.check.outputs.specs != ''
        env:
          SPECS: ${{ steps.check.outputs.specs }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(deps): bundle $SPECS, release $version"
          # Install scripts and tests ran in this tree; release nothing but the three files above.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Files other than package.json, package-lock.json and CHANGELOG.md changed:"
            git status --porcelain
            exit 1
          fi
          git tag "v$version"
          git push --atomic "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main "v$version"
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "v$version"

  # Publishes the tag this run started on. No `needs`: refresh runs only on main and this job
  # only on a tag, so the two never both run in one run.
  publish:
    if: >-
      ${{ !cancelled() && ((github.event_name == 'release' && !github.event.release.prerelease)
      || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # Without a `ref` input, checkout takes github.ref at github.sha: the commit provenance names.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Same npm pin as ci.yml, which says why.
      - run: npm install -g 'npm@^11.5.1'
      - name: Tag matches package.json version
        run: test "$TAG" = "v$(node -p 'require("./package.json").version')"
      - name: Lockfile resolves only from registry.npmjs.org
        run: "! grep -E '\"resolved\": \"' package-lock.json | grep -v 'https://registry.npmjs.org/'"
      # This job holds the id-token. The tree's only install scripts are dev-only: esbuild's
      # binary check (tsx resolves the binary from @esbuild/<platform> without it) and fsevents
      # (macOS). Tests and check:pack pass without them.
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Tarball ships every pi manifest path and no pi peers
        run: npm run check:pack
      - run: npm publish --access public
